name = "almost"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Starts the nightly render. GitHub's own schedule runs hours late, after the
# Frame's 00:05 fetch; Cloudflare's cron is on time. 10:00 UTC is 21:00 AEDT / 20:00 AEST.
[triggers]
crons = ["0 10 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "almost"

[vars]
GITHUB_REPO = "pwansell/almost"
GITHUB_WORKFLOW = "studio.yml"

# Secrets (set with `wrangler secret put NAME`):
#   FRAME_TOKEN    secret path segment the Frame uses
#   PREVIEW_TOKEN  secret path segment for the Preview page
#   GITHUB_TOKEN   fine-grained token with Actions: read and write on the repo
